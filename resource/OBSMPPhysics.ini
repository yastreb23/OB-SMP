; OB SMP Physics settings. The plugin reads them at start; the reload key (F7) reads them again and rebuilds every system.
[Main]
bEnabled=1

; Actors farther than this (game units) are simulated without collision; at most iMaxActors (nearest first) collide.
fCollisionDistance=1500
iMaxActors=10

; FSMP's world settings.
iMinFps=180
iMaxSubSteps=4
iSolverIterations=10
bCollisionThreads=0
iCollisionThreads=-1
; The step runs on a physics thread while the game draws (the bones one frame behind the body). 0: on the game thread.
bAsyncStep=1
fGravityScale=1.0
bUnclampedResets=1
fResetAngle=120

; Wind: the weather's wind speed. Oblivion's weather has no direction: fWindDirection in degrees (0 = north), or -1 to
; let it turn slowly.
bWind=1
fWindStrength=2.0
bWindInInteriors=0
fWindDirection=-1

bCollisions=1
bCollideOncePerFrame=0
; A ground plane at the actor's feet for the cloth to rest on (crouching, sitting).
bGround=1

; Smooths what is drawn of each simulated bone (not the physics): 0 light .. 1 strong.
bJitterFilter=1
fJitterSmoothing=0.5

; Keys (virtual-key codes): F7 reloads this file, F8 writes the player's and the nearest actors' 3D to the log.
iReloadKey=0x76
iDumpKey=0x77

; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors only. The log is OBSMPPhysics.log in the game folder.
iLogLevel=2
